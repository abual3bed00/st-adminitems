<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>Admin Item Giver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay">
    <div id="main-ui">
      <div class="header">
        <h2>Admin Item Giver</h2>
        <div class="search-container">
          <input type="text" id="search" placeholder="Search for item..." />
        </div>
      </div>

      <div class="top-controls">
        <div class="control">
          <label for="amount">Amount</label>
          <input type="number" id="amount" min="1" max="1000" value="1" />
        </div>
        <div class="control">
          <label for="target-id">Target ID (optional)</label>
          <input type="number" id="target-id" placeholder="Leave empty for yourself" />
        </div>
        <button id="give-btn" class="primary" disabled>Give Item</button>
      </div>

      <div id="items-list" class="grid"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
